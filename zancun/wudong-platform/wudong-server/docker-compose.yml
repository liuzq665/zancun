version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: wudong-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: wudong_platform
      MYSQL_USER: wudong
      MYSQL_PASSWORD: wudong123456
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    networks:
      - wudong-network

  redis:
    image: redis:7-alpine
    container_name: wudong-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - wudong-network

volumes:
  mysql_data:
  redis_data:

networks:
  wudong-network:
    driver: bridge
